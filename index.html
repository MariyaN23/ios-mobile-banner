<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Banner</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<div class="banner">
    <a href="#" class="banner__close">
        <img src="./assets/cross.svg" alt="close"/>
    </a>
    <div class="banner__content">
        <h1 data-i18n="Get Unlimited <br>Access" class="banner__content__title">
            Get Unlimited <br>Access
        </h1>
        <div class="banner__slogans">
            <div class="banner__slogans-item">
                <img
                        class="banner__slogans-img"
                        src="./assets/preview-img-1.png"
                        srcset="./assets/preview-img-1@2x.png 2x, ./assets/preview-img-1@3x.png 3x"
                        alt="img 1"
                />
                <span data-i18n="Unlimited Art <br>Creation" class="banner__slogans-text">
                    Unlimited Art <br>Creation
                </span>
            </div>
            <div class="banner__slogans-item">
                <img
                        class="banner__slogans-img"
                        src="./assets/preview-img-2.png"
                        srcset="./assets/preview-img-2@2x.png 2x, ./assets/preview-img-2@3x.png 3x"
                        alt="img 2"
                />
                <span data-i18n="Exclusive <br>Styles" class="banner__slogans-text">
                    Exclusive <br>Styles
                </span>
            </div>
            <div class="banner__slogans-item">
                <img
                        class="banner__slogans-img"
                        src="./assets/preview-img-3.png"
                        srcset="./assets/preview-img-3@2x.png 2x, ./assets/preview-img-3@3x.png 3x"
                        alt="img 3"
                />
                <span data-i18n="Magic Avatars <br>With 20% Off" class="banner__slogans-text">
                    Magic Avatars <br>With 20% Off
                </span>
            </div>
        </div>
        <form id="form" class="banner__subscriptions">
            <div class="banner__subscriptions-plan">
                <div class="subscriptions-offer__wrapper">
                    <div data-i18n="BEST OFFER" class="subscriptions-offer">
                        BEST OFFER
                    </div>
                </div>
                <input type="radio" id="yearly" name="subscription" value="yearly"/>
                <label for="yearly" data-i18n="YEARLY ACCESS">YEARLY ACCESS</label>
                <div class="banner__subscriptions-content">
                    <div>
                        <div data-i18n="YEARLY ACCESS" class="banner__subscriptions-title">
                            YEARLY ACCESS
                        </div>
                        <div data-i18n="Just {{yearlyAccess}} per year" class="banner__subscriptions-price">
                            Just {{yearlyAccess}} per year
                        </div>
                    </div>
                </div>
                <div class="banner__subscriptions-content">
                    <div data-i18n="{{yearlyPerWeek}} <br>per week" class="banner__subscriptions-price">
                        {{yearlyPerWeek}} <br>per week
                    </div>
                </div>
            </div>
            <div class="banner__subscriptions-plan">
                <input type="radio" id="weekly" name="subscription" value="weekly" checked/>
                <label for="weekly" data-i18n="WEEKLY ACCESS">WEEKLY ACCESS</label>
                <div class="banner__subscriptions-content">
                    <div data-i18n="WEEKLY ACCESS" class="banner__subscriptions-title">
                        WEEKLY ACCESS
                    </div>
                </div>
                <div class="banner__subscriptions-content">
                    <div data-i18n="{{weeklyAccess}} <br>per week" class="banner__subscriptions-price">
                        {{weeklyAccess}} <br>per week
                    </div>
                </div>
            </div>
            <button data-i18n="Continue" class="banner__subscriptions-btn" type="submit">
                Continue
            </button>
        </form>
        <div class="banner__toolbar">
            <a
                    class="banner__toolbar-link"
                    data-i18n="Terms of Use"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
            >
                Terms of Use
            </a>
            <a
                    class="banner__toolbar-link"
                    data-i18n="Privacy Policy"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer">
                Privacy Policy
            </a>
            <a class="banner__toolbar-link"
               data-i18n="Restore"
               href="#"
               target="_blank"
               rel="noopener noreferrer"
            >
                Restore
            </a>
        </div>
    </div>
</div>
<script src="index.js" type="module"></script>
</body>
</html>
